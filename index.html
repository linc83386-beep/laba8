<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Лабораторна робота №8</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f4f4f4; margin: 0; }
    .card { background: #fff; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 420px; }
    .game { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 25px 0; }
    .player { display: flex; flex-direction: column; align-items: center; width: 100px; }
    .score { background: #00a8e8; color: #fff; font-weight: bold; width: 80px; padding: 6px 0; border-radius: 5px; margin-bottom: 12px; }
    .num { background: #ffff00; border: 3px solid #000; width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; margin-bottom: 8px; }
    #genBtn { background: #00ff00; border: 2px solid #000; font-weight: bold; padding: 10px 16px; border-radius: 6px; cursor: pointer; align-self: center; margin-top: 35px; }
    #genBtn:disabled { background: #ccc; cursor: not-allowed; }
    .status { font-size: 15px; font-weight: bold; min-height: 24px; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <h3>Гра «Більше число», кто переміг тот переміг</h3>

    <div class="game">
      <div class="player">
        <div class="score" id="uScore">0</div>
        <div class="num" id="uNum">?</div>
        <b id="uName">User</b>
      </div>

      <button id="genBtn" onclick="play()">Generate</button>

      <div class="player">
        <div class="score" id="cScore">0</div>
        <div class="num" id="cNum">?</div>
        <b>Комп'ютер</b>
      </div>
    </div>

    <div class="status" id="status">Натисніть Generate</div>
    <button onclick="init()">Почати знову</button>
  </div>

  <script>
    let uName = "User", uScore = 0, cScore = 0;

    function init() {
      let input = prompt("Введіть ім'я:", "Гравець");
      uName = (input && input.trim()) ? input.trim() : "User";
      uScore = cScore = 0;
      document.getElementById("uName").textContent = uName;
      document.getElementById("uScore").textContent = "0";
      document.getElementById("cScore").textContent = "0";
      document.getElementById("uNum").textContent = "?";
      document.getElementById("cNum").textContent = "?";
      document.getElementById("status").textContent = "Натисніть Generate";
      document.getElementById("genBtn").disabled = false;
    }

    function play() {
      if (uScore >= 3 || cScore >= 3) return;

      let uNum = Math.floor(Math.random() * 10) + 1;
      let cNum = Math.floor(Math.random() * 10) + 1;

      document.getElementById("uNum").textContent = uNum;
      document.getElementById("cNum").textContent = cNum;

      let st = document.getElementById("status");

      if (uNum > cNum) {
        uScore++;
        document.getElementById("uScore").textContent = uScore;
        st.textContent = `Раунд за ${uName}!`;
      } else if (cNum > uNum) {
        cScore++;
        document.getElementById("cScore").textContent = cScore;
        st.textContent = "Раунд за Комп'ютером!";
      } else {
        st.textContent = "Нічия!";
      }

      if (uScore === 3) {
        st.textContent = `🎉 Переміг ${uName}!`;
        document.getElementById("genBtn").disabled = true;
      } else if (cScore === 3) {
        st.textContent = "🤖 Перемога за Комп'ютером!";
        document.getElementById("genBtn").disabled = true;
      }
    }

    window.onload = init;
  </script>
</body>
</html>
